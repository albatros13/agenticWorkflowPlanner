[project]
name = "agentic-workflow-planner"
version = "0.1.0"
description = "Guideline-to-BPMN agent: converts natural-language process descriptions into auditable BPMN 2.0 models via a validated, staged pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "pydantic>=2.13",
    "uvicorn>=0.52",
]

[project.optional-dependencies]
# Providers / stores are optional so the core package and its test-suite import
# and run without them (the pipeline falls back to in-memory + mocked LLM).
llm = ["anthropic>=0.40", "openai>=1.50"]
retrieval = ["qdrant-client>=1.9"]
bpmn = ["lxml>=5.0", "xmlschema>=3.0", "spiffworkflow>=3.0"]  # used from Phase 5 on
eflint = ["rdflib>=7.0", "pyshacl>=0.26"]  # text->eFLINT: vendored FLINT ontology + SHACL validation
provenance = ["neo4j>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx powers the FastAPI TestClient

[tool.setuptools.packages.find]
# The agents/ tree holds all agent source, incl. the text->BPMN pipeline
# (agents/text_to_bpmn/pipeline). app/ and api/ are run from the repo root, not installed.
include = ["agents*"]

[tool.setuptools.package-data]
# Ship the vendored FLINT ontology data (ttl/rq) + its license notices inside the wheel so
# importlib.resources can read them when installed. See agents/text_to_eflint/flint/README.md.
"agents.text_to_eflint.flint" = ["data/**/*.ttl", "data/**/*.rq", "data/**/LICENSE", "VERSION", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
