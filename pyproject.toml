[project]
name = "agentic-workflow-planner"
version = "0.1.0"
description = "Guideline-to-BPMN agent: converts natural-language process descriptions into auditable BPMN 2.0 models via a validated, staged pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "pydantic>=2.13",
    "uvicorn>=0.52",
]

[project.optional-dependencies]
# Providers / stores are optional so the core package and its test-suite import
# and run without them (the pipeline falls back to in-memory + mocked LLM).
llm = ["anthropic>=0.40", "openai>=1.50"]
retrieval = ["qdrant-client>=1.9"]
bpmn = ["lxml>=5.0", "xmlschema>=3.0", "spiffworkflow>=3.0"]  # used from Phase 5 on
provenance = ["neo4j>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx powers the FastAPI TestClient

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
